services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: soc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: soc
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soc"]
      interval: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db: {condition: service_healthy}
    ports: ["8000:8000"]
    environment:
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY (>= 32 random chars)}
      DATABASE_URL: postgresql://soc:${POSTGRES_PASSWORD}@db:5432/soc
      SEED_DEMO: "false"
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

volumes:
  pgdata:
